# Codecov reports on pull requests but never blocks them: the coverage floor
# is enforced by SimpleCov in the test job (spec/spec_helper.rb).
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "diff, files"
  require_changes: true
