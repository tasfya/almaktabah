# Staging environment for almaktabah.
# Runs on the same host as production but as a fully isolated Kamal service:
# separate containers, volume and Typesense accessory. Staging data is
# disposable: there is no Litestream replica, and media is stored on the
# staging volume instead of production's buckets. Deployed by its own job in
# the same GitHub Actions workflow as production (same commit, same CI gate),
# not a promoted artifact — each job runs `kamal deploy`, which builds and
# pushes its own image.
#
# `kamal deploy` never boots accessories; the deploy-staging job boots
# Typesense when its container is missing. After changing the accessory's
# config, run `kamal accessory reboot typesense -c kamal_config/deploy.staging.yml`.
service: almaktabah_staging

image: mohamedrez/almaktabah

servers:
  web:
    - 188.245.209.159
  job:
    hosts:
      - 188.245.209.159
    cmd: bin/jobs

proxy:
  ssl: true
  hosts:
    - staging.3ilm.org

registry:
  username: mohamedrez
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - TYPESENSE_API_KEY
    - GROQ_API_KEY
  clear:
    JOB_CONCURRENCY: 10
    # Keep uploads on the staging volume, out of production's media buckets.
    LOCAL_MEDIA_STORAGE: "true"
    # The seeded main site answers on the staging hostname.
    SEED_DOMAIN_HOST: staging.3ilm.org
    # config/recurring.yml's production schedule would otherwise run here too.
    SOLID_QUEUE_SKIP_RECURRING: "true"
    # Staging is not for search engines.
    DISALLOW_ROBOTS: "true"

    # Accessory containers are namespaced by Kamal as <service>-<accessory_name>.
    TYPESENSE_HOST: almaktabah_staging-typesense
    TYPESENSE_PORT: 8108

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Isolated volume — staging never touches prod SQLite files.
volumes:
  - "almaktabah_staging_storage:/rails/storage"

asset_path: /rails/public/assets

# The first boot runs db:prepare on an empty volume (schema, seeds, Typesense
# reindex) before Puma listens; kamal's 30s default would stop it mid-seed.
deploy_timeout: 600

builder:
  arch: amd64
  cache:
    type: gha
    options: mode=max
    image: app-build-cache

accessories:
  typesense:
    image: typesense/typesense:29.0
    host: 188.245.209.159
    env:
      secret:
        - TYPESENSE_API_KEY
      clear:
        TYPESENSE_DATA_DIR: /data
        TYPESENSE_ENABLE_CORS: "false"
        TYPESENSE_MEMORY_LIMIT: 1GB
    directories:
      - typesense_staging_data:/data
