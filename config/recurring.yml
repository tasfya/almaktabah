production:
  video_batch_processing:
    class: VideoBatchProcessingJob
    schedule: every 6 hours

  audio_duration_batch:
    class: AudioDurationBatchJob
    schedule: every 2 hours

  lecture_kind_assignment:
    class: LectureKindAssignmentJob
    schedule: every 3 hours

  purge_original_audio:
    class: PurgeOriginalAudioBatchJob
    schedule: every 12 hours

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

# Example schedule syntax:
#   schedule: every hour
#   schedule: every 6 hours
#   schedule: at 5am every day
#   schedule: every Monday at 9am
