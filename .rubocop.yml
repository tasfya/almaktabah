# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec
  - rubocop-factory_bot
  - rubocop-rspec_rails

AllCops:
  Exclude:
    - 'db/schema.rb'  # auto-generated by `bin/rails db:schema:dump`

# The RSpec plugins run only the cops that catch broken or misleading specs;
# their style cops stay off.
RSpec:
  Enabled: false
FactoryBot:
  Enabled: false
RSpecRails:
  Enabled: false

RSpec/Focus:
  Enabled: true
RSpec/EmptyExampleGroup:
  Enabled: true
RSpec/RepeatedExample:
  Enabled: true
RSpec/RepeatedExampleGroupBody:
  Enabled: true
RSpec/NoExpectationExample:
  Enabled: true
RSpec/AnyInstance:
  Enabled: true
  # Existing stubs predating the rule; new code uses instance_double.
  Exclude:
    - 'spec/support/typesense.rb'
    - 'spec/services/domain_content_types_service_spec.rb'
    - 'spec/jobs/video_processing_job_spec.rb'

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false
