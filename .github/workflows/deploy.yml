name: Deployment

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

jobs:
  deploy-production:
    # Gate: only deploy if the CI run that triggered us actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DOCKER_BUILDKIT: 1
      RAILS_ENV: production
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PUBLIC_AWS_S3_3ILM_ACCESS_KEY_ID: ${{ secrets.PUBLIC_AWS_S3_3ILM_ACCESS_KEY_ID }}
      PUBLIC_AWS_S3_3ILM_ACCESS_KEY: ${{ secrets.PUBLIC_AWS_S3_3ILM_ACCESS_KEY }}
      LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
      LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
      LITESTREAM_REPLICA_BUCKET: ${{ secrets.LITESTREAM_REPLICA_BUCKET }}
      LITESTREAM_REPLICA_ENDPOINT: ${{ secrets.LITESTREAM_REPLICA_ENDPOINT }}
      KAMAL_REGISTRY_USERNAME: mohamedrez

    environment: production
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          submodules: false #TODO: enable this back when we need to deploy frontend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Runtime for cache
        uses: crazy-max/ghaction-github-runtime@v3

      # KAMAL
      # Kamal comes from Gemfile.lock, so production is deployed with the same
      # version developers run.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Show Kamal version
        run: bin/kamal version

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Kamal Deploy
        run: |
          echo "Deploying to production"
          bin/kamal deploy

      # `kamal deploy` never boots accessories, and `accessory boot` skips an
      # existing container without starting it. `docker start` is a no-op on a
      # running container and starts a stopped one; it fails only when the
      # container is missing, and then we boot it.
      - name: Start or boot Litestream
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@188.245.209.159 \
            docker start almaktabah-litestream >/dev/null 2>&1 \
            || bin/kamal accessory boot litestream

  deploy-staging:
    # Gate: only deploy if the CI run that triggered us actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      DOCKER_BUILDKIT: 1
      RAILS_ENV: production
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KAMAL_REGISTRY_USERNAME: mohamedrez

    environment: staging
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          submodules: false #TODO: enable this back when we need to deploy frontend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Runtime for cache
        uses: crazy-max/ghaction-github-runtime@v3

      # KAMAL
      # Kamal comes from Gemfile.lock, so production is deployed with the same
      # version developers run.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Show Kamal version
        run: bin/kamal version

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # `kamal deploy` never boots accessories, and `accessory boot` skips an
      # existing container without starting it. `docker start` is a no-op on a
      # running container and starts a stopped one; it fails only when the
      # container is missing, and then we boot it. The app's first boot seeds
      # and reindexes into it.
      - name: Start or boot Typesense
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@188.245.209.159 \
            docker start almaktabah_staging-typesense >/dev/null 2>&1 \
            || bin/kamal accessory boot typesense -c kamal_config/deploy.staging.yml

      - name: Kamal Deploy
        run: |
          echo "Deploying to staging"
          bin/kamal deploy -c kamal_config/deploy.staging.yml
