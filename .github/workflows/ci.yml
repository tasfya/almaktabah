name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      typesense:
        image: typesense/typesense:29.0
        env:
          TYPESENSE_DATA_DIR: /data
          TYPESENSE_API_KEY: xyz
        ports:
          - 8108:8108
        volumes:
          - typesense-data:/data
    env:
      TYPESENSE_HOST: localhost
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: xyz
      TYPESENSE_PROTOCOL: http
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Cache system dependencies
        # apt's own directories are root-owned (lists/partial is 0700), so the
        # cache step can neither save nor restore them. Cache only the
        # downloaded .debs, in a runner-owned directory, and copy them in/out.
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('**/ci.yml') }}
          restore-keys: |
            apt-debs-${{ runner.os }}-
      - name: Install system dependencies
        run: |
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y curl libjemalloc2 libvips sqlite3 ffmpeg imagemagick fonts-noto libmagickcore-6.q16-6-extra

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install Playwright browsers
        # The driver runs `npx playwright@<version>` with the version the
        # playwright-ruby-client gem declares (spec/support/capybara.rb), so the
        # browser installed here comes from that same CLI and moves only when the
        # gem is bumped.
        run: |
          version=$(bundle exec ruby -e 'require "playwright"; print Playwright::COMPATIBLE_PLAYWRIGHT_VERSION')
          npx --yes "playwright@$version" install --with-deps

      - name: Keep downloaded packages for the cache
        # After Playwright's --with-deps so its packages are cached too.
        run: cp /var/cache/apt/archives/*.deb ~/apt-debs/

      - name: migrate database
        run: bin/rails db:create db:migrate RAILS_ENV=test

      - name: Build Tailwind CSS
        # System specs measure layout, so they need the compiled stylesheet.
        run: bin/rails tailwindcss:build

      - name: Wait for Typesense
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8108/health >/dev/null; then echo "Typesense ready"; exit 0; fi
            echo "waiting for Typesense ($i)"; sleep 2
          done
          echo "Typesense did not become ready"; exit 1

      - name: Run tests
        run: bundle exec rspec --format documentation --color --profile

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
